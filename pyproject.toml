[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meeyg"
version = "1.0.0"
description = "MEEYG - Modular Enterprise Environment for Yield Gathering"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0.0",
    "sqlcipher3>=0.5.3",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "pyside6>=6.6.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "aiohttp>=3.9.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "tenacity>=8.2.0",
    "tqdm>=4.66.0",
    "structlog>=24.0.0",
    "pydantic-settings>=2.0.0",
    "playwright>=1.40.0",
    "playwright-stealth>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
